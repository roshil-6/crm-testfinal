name: Deploy Backend to Railway

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Railway
        uses: bervProject/railway-deploy@v3.0.1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: backend
          detach: false
